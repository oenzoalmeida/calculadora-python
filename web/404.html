  <style>
    :root {
      --fundo: #0f0f11;
      --superficie: #17171a;
      --borda: #2a2a30;
      --texto: #f2f2f3;
      --texto-2: #9b9ba3;
      --acento: #e8863a;
      --raio: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1100px 700px at 80% -10%, #1c1c22 0%, var(--fundo) 55%);
      color: var(--texto);
      padding: 24px;
    }
    main {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      padding: 48px 40px;
      max-width: 420px;
      text-align: center;
    }
    .codigo { font-size: 56px; font-weight: 700; color: var(--acento); margin: 0; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: var(--texto-2); margin: 0 0 24px; }
    a {
      display: inline-block;
      background: var(--acento);
      color: #1a1108;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
    }
    a:hover { background: #f2984f; }
  </style>

  <main>
